name: CI

on:
  push:
    branches: [ main, 'dev*', 'copilot/**' ]
  pull_request:
    branches: [ main, 'dev*' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------- 规则门禁（快）
  rules:
    name: Rules (format / ascii / paths / spec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 新引入的规则，历史文件可能不合规；稳定后再去掉 continue-on-error
      - name: clang-format check
        continue-on-error: true
        run: |
          python -m pip install --quiet clang-format==18.1.8
          files=$(git ls-files '*.h' '*.hpp' '*.cpp' '*.cc' | grep -v -E '^(openspec|docs|assets)/' || true)
          if [ -n "$files" ]; then clang-format --dry-run --Werror $files; fi

      # 新引入的规则（防 MSVC C4819），先只警告
      - name: Sources are ASCII-only
        continue-on-error: true
        run: |
          if git grep -nP '[^\x00-\x7F]' -- '*.h' '*.hpp' '*.cpp' '*.cc'; then
            echo "::error::C/C++ sources must be ASCII-only (MSVC C4819)"
            exit 1
          fi

      - name: No hardcoded absolute paths in build config
        run: |
          if git grep -nE '([A-Za-z]:[\\/]|/Users/|/home/)' -- \
              'CMakeLists.txt' '*/CMakeLists.txt' '*/*/CMakeLists.txt' \
              'cmake/*.cmake' 'cmake/*.json' 'python/*.py'; then
            echo "::error::build config must not contain local absolute paths"
            exit 1
          fi

      - name: OpenSpec validate
        continue-on-error: true
        run: |
          npm i -g openspec@1.3.1 || true
          openspec validate --all || true

  # ---------------------------------------------------- 编译 + 测试（Windows）
  # Windows 不需要 Vulkan SDK：vulkan 后端走 3rdParty::vulkan_headers + VK_NO_PROTOTYPES，
  # find_package(Vulkan) 只在 APPLE 分支触发。
  build-windows:
    name: Build & Test (windows)
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      THIRD_PARTY_DIR: ${{ github.workspace }}/3rd/Win32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # third_party.py 只依赖 GitPython；不装整个 requirements.txt（含 PySide6，CI 不需要）
      - name: Install python deps
        run: python -m pip install --quiet GitPython==3.1.44

      - name: Restore third-party
        id: tp
        uses: actions/cache/restore@v4
        with:
          path: 3rd
          key: 3rd-win-x64-${{ hashFiles('cmake/thirdparty.json', 'python/third_party.py', 'python/build_*.py', 'cmake/patches/**') }}

      # cache miss 时全量构建（约 1~2 小时）；日常命中缓存
      - name: Build third-party (cache miss)
        if: steps.tp.outputs.cache-hit != 'true'
        run: python python/third_party.py -p Win32 -o 3rd -e . -j 0

      - name: Save third-party
        if: steps.tp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 3rd
          key: 3rd-win-x64-${{ hashFiles('cmake/thirdparty.json', 'python/third_party.py', 'python/build_*.py', 'cmake/patches/**') }}

      - name: Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -D3RD_PATH="${{ env.THIRD_PARTY_DIR }}" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DSKY_BUILD_TEST=ON `
            -DSKY_BUILD_SANDBOX=ON `
            -DSKY_BUILD_TOOL=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # 需要 GPU 的测试套件在无显卡 runner 上通过 GTEST_SKIP 自行跳过
      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-windows
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ---------------------------------------------------- 编译（macOS，Metal 门禁）
  # 初期 continue-on-error：三方树 MacOS-arm 首次需全量构建，且 MoltenVK 环境需迭代。
  # 稳定后去掉 continue-on-error，成为 Metal 后端的强制门禁。
  build-macos:
    name: Build (macos, experimental)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 360
    env:
      THIRD_PARTY_DIR: ${{ github.workspace }}/3rd/MacOS-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python deps
        run: python -m pip install --quiet GitPython==3.1.44

      # APPLE 分支的 vulkan 后端执行 find_package(Vulkan REQUIRED)，MoltenVK 提供 loader
      - name: Install Vulkan (MoltenVK)
        run: brew install molten-vk vulkan-headers vulkan-loader

      - name: Restore third-party
        id: tp
        uses: actions/cache/restore@v4
        with:
          path: 3rd
          key: 3rd-macos-arm-${{ hashFiles('cmake/thirdparty.json', 'python/third_party.py', 'python/build_*.py', 'cmake/patches/**') }}

      - name: Build third-party (cache miss)
        if: steps.tp.outputs.cache-hit != 'true'
        run: python python/third_party.py -p MacOS-arm -o 3rd -e . -j 0

      - name: Save third-party
        if: steps.tp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 3rd
          key: 3rd-macos-arm-${{ hashFiles('cmake/thirdparty.json', 'python/third_party.py', 'python/build_*.py', 'cmake/patches/**') }}

      - name: Configure
        run: |
          cmake -B build \
            -D3RD_PATH="${{ env.THIRD_PARTY_DIR }}" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSKY_BUILD_TEST=ON \
            -DSKY_BUILD_TOOL=ON

      - name: Build
        run: cmake --build build --parallel

      # macos runner 有 Metal GPU，可跑设备测试；初期先只编译，稳定后放开
      # - name: Test
      #   run: ctest --test-dir build --output-on-failure
